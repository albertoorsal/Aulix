name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The @SpringBootTest context tests boot each service for real: they pull config from
    # config-server, run Flyway against Postgres and connect Kafka listeners.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aulatech_db
          POSTGRES_USER: aulix
          POSTGRES_PASSWORD: aulix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aulix"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]

    env:
      DB_URL: jdbc:postgresql://localhost:5432/aulatech_db
      DB_USERNAME: aulix
      DB_PASSWORD: aulix
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      CONFIG_SERVER_URI: http://localhost:8888

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build all modules
        run: mvn -B -ntp install -DskipTests

      - name: Start config-server
        run: |
          nohup java -jar applications/config-server/target/config-server.jar > config-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8888/student-service/default > /dev/null && exit 0
            sleep 2
          done
          cat config-server.log
          exit 1

      - name: Run tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/
            config-server.log
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: applications/frontend-aulix

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: applications/frontend-aulix/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
