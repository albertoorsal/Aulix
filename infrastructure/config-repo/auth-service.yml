server:
  port: 9000

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aulatech_db}
    username: ${DB_USERNAME:nailich}
    password: ${DB_PASSWORD:Senegal26.}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # All services share aulatech_db, so each gets its own history table --
    # otherwise Flyway's version numbers (every service starts at V1) collide.
    table: flyway_schema_history_auth
    # See student-service.yml for why this is needed once more than one service's
    # tables coexist in the same shared schema.
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # key/value serializers are set explicitly in KafkaProducerConfig (String/Jackson),
      # not read from here -- see that class for why a custom ProducerFactory bean exists.
      acks: all

security:
  starter:
    autoconfig:
      enabled: false # auth-service defines its own SecurityFilterChain (issues tokens, doesn't just validate them)

app:
  kafka:
    topics:
      user-events: user-events
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:9000}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14
