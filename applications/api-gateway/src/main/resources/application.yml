spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1500
    loadbalancer:
      ribbon:
        enabled: false

management:
  endpoint:
    gateway:
      access: read_only
