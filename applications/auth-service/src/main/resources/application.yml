spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1500

# Seed admin user, created on first startup if no user with this email exists.
# Set ADMIN_SEED_PASSWORD explicitly in real environments; otherwise a random
# password is generated and logged once at startup.
admin:
  seed:
    email: ${ADMIN_SEED_EMAIL:admin@aulix.com}
    password: ${ADMIN_SEED_PASSWORD:}

app:
  cookie:
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
